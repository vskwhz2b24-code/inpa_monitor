name: Monitor inPA

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Controlla inPA e invia eventuale notifica
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys

          import requests
          from bs4 import BeautifulSoup

          URL = "https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=64051e592a564f5fabce426c0816bb27"
          STATE_FILE = "inpa_state.json"

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; inPA-Monitor/1.0)"
          }

          try:
              response = requests.get(URL, headers=headers, timeout=30)
              response.raise_for_status()
          except Exception as e:
              print(f"Errore nel collegamento a inPA: {e}")
              sys.exit(1)

          soup = BeautifulSoup(response.text, "html.parser")

          # Prendiamo il contenuto principale della pagina.
          # Eliminiamo elementi tecnici che possono cambiare senza
          # rappresentare una vera novità per l'utente.
          for tag in soup(["script", "style", "noscript"]):
              tag.decompose()

          # Costruiamo una rappresentazione stabile del contenuto.
          main_text = soup.get_text("\n", strip=True)

          lines = []
          for line in main_text.splitlines():
              line = re.sub(r"\s+", " ", line).strip()
              if line:
                  lines.append(line)

          # Rimuoviamo duplicati mantenendo l'ordine.
          seen = set()
          content = []

          for line in lines:
              if line not in seen:
                  seen.add(line)
                  content.append(line)

          snapshot = "\n".join(content)
          current_hash = hashlib.sha256(
              snapshot.encode("utf-8")
          ).hexdigest()

          old_snapshot = ""
          old_hash = None

          if os.path.exists(STATE_FILE):
              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      old_state = json.load(f)
                      old_hash = old_state.get("hash")
                      old_snapshot = old_state.get("snapshot", "")
              except Exception:
                  pass

          # PRIMA ESECUZIONE DEL NUOVO MONITOR:
          # salviamo lo stato attuale senza notificare
          # tutto ciò che era già presente.
          if old_hash is None:
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(
                      {
                          "hash": current_hash,
                          "snapshot": snapshot
                      },
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              subprocess.run(
                  ["git", "config", "user.name", "inPA Monitor"],
                  check=False
              )
              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "inpa-monitor@users.noreply.github.com"
                  ],
                  check=False
              )
              subprocess.run(["git", "add", STATE_FILE], check=False)
              subprocess.run(
                  ["git", "commit", "-m", "Salva stato iniziale inPA"],
                  check=False
              )
              subprocess.run(["git", "push"], check=False)

              print("Stato iniziale salvato. Nessuna notifica.")
              sys.exit(0)

          # Nessuna modifica.
          if current_hash == old_hash:
              print("Nessuna novità su inPA.")
              sys.exit(0)

          old_items = set(old_snapshot.splitlines())
          new_items = [
              item for item in content
              if item not in old_items
          ]

          if not new_items:
              new_items = [
                  "La pagina inPA è cambiata. Controlla la pagina per i dettagli."
              ]

          message = "🚨 NUOVO AGGIORNAMENTO INPA\n\n"
          message += "RIPAM Piccoli Comuni\n\n"

          for item in new_items[:20]:
              message += "📌 " + item + "\n"

          if len(new_items) > 20:
              message += (
                  f"\n...e altri {len(new_items) - 20} elementi."
              )

          message += f"\n🔗 {URL}"

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          telegram_url = (
              f"https://api.telegram.org/bot{token}/sendMessage"
          )

          telegram_response = requests.post(
              telegram_url,
              data={
                  "chat_id": chat_id,
                  "text": message
              },
              timeout=30
          )

          telegram_response.raise_for_status()

          print("Notifica Telegram inviata.")

          # Salviamo il nuovo stato SOLO dopo l'invio riuscito.
          with open(STATE_FILE, "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "hash": current_hash,
                      "snapshot": snapshot
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          subprocess.run(
              ["git", "config", "user.name", "inPA Monitor"],
              check=False
          )
          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "inpa-monitor@users.noreply.github.com"
              ],
              check=False
          )
          subprocess.run(["git", "add", STATE_FILE], check=False)
          subprocess.run(
              ["git", "commit", "-m", "Aggiorna stato monitor inPA"],
              check=False
          )
          subprocess.run(["git", "push"], check=False)
          PY
